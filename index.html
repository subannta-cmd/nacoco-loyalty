<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na COCO Loyalty 🥥</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-gray-50 p-4 flex flex-col items-center">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-lg mt-10">
        <h1 class="text-2xl font-bold text-green-800 text-center mb-6">Na COCO Loyalty 🥥</h1>
        <input type="tel" id="phone-input" placeholder="กรอกเบอร์โทรศัพท์" class="w-full p-4 border-2 rounded-2xl mb-4 text-center text-xl outline-none focus:border-green-500">
        <button onclick="searchCustomer()" id="btn-search" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold mb-6 hover:bg-green-700 transition">ตรวจสอบแต้ม</button>

        <div id="reward-card" class="hidden border-t pt-6 text-center">
            <div class="flex justify-between items-center mb-4">
                <span id="display-phone" class="font-bold text-gray-600"></span>
                <span id="display-points" class="text-2xl font-bold text-green-600">0/10</span>
            </div>
            <div id="stamp-grid" class="grid grid-cols-5 gap-3 mb-6"></div>
            <div class="flex gap-2">
                <button onclick="updatePoint('add')" id="btn-add" class="flex-grow bg-green-600 text-white py-4 rounded-xl font-bold active:scale-95 transition shadow-md">เพิ่ม 1 แต้ม</button>
                <button onclick="updatePoint('redeem')" id="btn-redeem" class="hidden flex-grow bg-orange-500 text-white py-4 rounded-xl font-bold active:scale-95 transition text-lg shadow-md">✨ แลกแก้วฟรี!</button>
            </div>
        </div>
    </div>

<script>
    // *** สำคัญ: วาง URL ที่ได้จากขั้นตอน Deploy ใหม่ตรงนี้ ***
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz3T06_nZYsHwurD0WlexhM_cvIuDmuhdQ6yKHpT4dEId2bkUpV7Vh2BswJ9Tfxdt3c/exec'; 

    let currentCustomer = '';

    window.onload = function() {
        const savedPhone = localStorage.getItem('coco_phone');
        if (savedPhone) {
            document.getElementById('phone-input').value = savedPhone;
            searchCustomer();
        }
    };

    async function searchCustomer() {
        const phoneInput = document.getElementById('phone-input').value.trim();
        if (phoneInput.length < 9) return;
        
        localStorage.setItem('coco_phone', phoneInput);
        const btn = document.getElementById('btn-search');
        btn.innerText = 'กำลังโหลด...';
        currentCustomer = phoneInput;

        try {
            const response = await fetch(scriptURL + '?phone=' + currentCustomer + '&t=' + Date.now());
            const pointsText = await response.text();
            renderUI(parseInt(pointsText.trim()) || 0);
            document.getElementById('reward-card').classList.remove('hidden');
        } catch (e) { 
            alert("ดึงข้อมูลไม่สำเร็จ"); 
        } finally {
            btn.innerText = 'ตรวจสอบแต้ม';
        }
    }

    function renderUI(pts) {
        document.getElementById('display-phone').innerText = 'เบอร์: ' + currentCustomer;
        document.getElementById('display-points').innerText = pts + '/10';
        const grid = document.getElementById('stamp-grid');
        grid.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
            const isActive = i <= pts;
            grid.innerHTML += `<div class="aspect-square rounded-full border-2 flex items-center justify-center transition-all duration-300 ${isActive ? 'bg-green-100 border-green-500 text-green-600 shadow-sm' : 'border-dashed border-gray-200 text-gray-300'}">${isActive ? '<i class="fas fa-check-circle text-2xl"></i>' : i}</div>`;
        }
        document.getElementById('btn-add').classList.toggle('hidden', pts >= 10);
        document.getElementById('btn-redeem').classList.toggle('hidden', pts < 10);
    }

    async function updatePoint(action) {
        if (action === 'redeem' && !confirm("ยืนยันการใช้สิทธิ์แลกฟรี?")) return;
        const btn = (action === 'add') ? document.getElementById('btn-add') : document.getElementById('btn-redeem');
        const originalText = btn.innerText;
        btn.innerText = 'บันทึก...';
        btn.disabled = true;

        try {
            await fetch(scriptURL + '?phone=' + currentCustomer + '&action=' + action + '&t=' + Date.now());
            setTimeout(async function() {
                await searchCustomer(); 
                btn.disabled = false;
                btn.innerText = originalText;
            }, 1000);
        } catch (e) { 
            alert("บันทึกไม่สำเร็จ");
            btn.disabled = false;
            btn.innerText = originalText;
        }
    }
</script>
</body>
</html>
