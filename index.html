<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na COCO Loyalty 🥥</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .stamp-node { transition: all 0.3s ease; }
        .active-stamp { border-color: #10b981 !important; color: #10b981 !important; background-color: #ecfdf5; }
    </style>
</head>
<body class="bg-gray-50 p-4 flex flex-col items-center">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-lg mt-10">
        <h1 class="text-2xl font-bold text-green-800 text-center mb-6">Na COCO Loyalty 🥥</h1>
        
        <input type="tel" id="phone-input" placeholder="กรอกเบอร์โทรศัพท์" 
               class="w-full p-4 border-2 rounded-2xl mb-4 text-center text-xl outline-none focus:border-green-500">
        
        <button onclick="searchCustomer()" id="btn-search" 
                class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold mb-6 hover:bg-green-700 transition shadow-md">
            ตรวจสอบแต้ม
        </button>

        <div id="reward-card" class="hidden border-t pt-6 text-center">
            <div class="flex justify-between items-center mb-4">
                <span id="display-phone" class="font-bold text-gray-600"></span>
                <span id="display-points" class="text-2xl font-bold text-green-600">0/10</span>
            </div>
            
            <div id="stamp-grid" class="grid grid-cols-5 gap-3 mb-6">
                </div>

            <div class="flex gap-2">
                <button onclick="updatePoint('add')" id="btn-add" 
                        class="flex-grow bg-green-600 text-white py-4 rounded-xl font-bold active:scale-95 transition shadow-md">
                    เพิ่ม 1 แต้ม
                </button>
                <button onclick="updatePoint('redeem')" id="btn-redeem" 
                        class="hidden flex-grow bg-orange-500 text-white py-4 rounded-xl font-bold active:scale-95 transition text-lg shadow-md">
                    ✨ แลกแก้วฟรี!
                </button>
            </div>
            <p id="status-text" class="mt-4 text-sm text-gray-400 font-light">กรุณาให้พนักงานเป็นผู้กดเพิ่มแต้ม</p>
        </div>
    </div>

<script>
    // *** สำคัญ: วางลิงก์ Web App URL จาก Google Apps Script ของคุณที่นี่ ***
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz3T06_nZYsHwurD0WlexhM_cvIuDmuhdQ6yKHpT4dEId2bkUpV7Vh2BswJ9Tfxdt3c/exec';

    // 1. ระบบทำงานอัตโนมัติเมื่อเปิดหน้าเว็บ
    window.onload = function() {
        createStampGrid(); // สร้างช่องวงกลมรอไว้
        const savedPhone = localStorage.getItem('coco_phone');
        if (savedPhone) {
            document.getElementById('phone-input').value = savedPhone;
            searchCustomer(); // ถ้าเคยกรอกแล้ว ให้โหลดแต้มทันที
        }
    };

    // ฟังก์ชันสร้างช่องวงกลม 10 ช่อง
    function createStampGrid() {
        const grid = document.getElementById('stamp-grid');
        grid.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
            grid.innerHTML += `
                <div class="w-12 h-12 rounded-full border-4 border-gray-200 flex items-center justify-center text-gray-300 font-bold stamp-node" id="stamp-${i}">
                    ${i}
                </div>`;
        }
    }

    // 2. ฟังก์ชันค้นหา/ตรวจสอบแต้ม
    function searchCustomer() {
        const phone = document.getElementById('phone-input').value;
        if (!phone) {
            alert('กรุณากรอกเบอร์โทรศัพท์');
            return;
        }
        
        document.getElementById('btn-search').innerText = 'กำลังโหลด...';
        localStorage.setItem('coco_phone', phone); // จำเบอร์ลงเครื่องลูกค้า

        fetch(`${scriptURL}?phone=${phone}&action=search`)
            .then(res => res.text())
            .then(pts => {
                document.getElementById('btn-search').innerText = 'ตรวจสอบแต้ม';
                document.getElementById('reward-card').classList.remove('hidden');
                document.getElementById('display-phone').innerText = 'สมาชิก: ' + phone;
                updateDisplay(parseInt(pts));
            })
            .catch(err => {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                document.getElementById('btn-search').innerText = 'ตรวจสอบแต้ม';
            });
    }

    // 3. ฟังก์ชันเพิ่มแต้ม หรือ แลกรางวัล
    function updatePoint(action) {
        const phone = document.getElementById('phone-input').value;
        if (!phone) return;

        const confirmMsg = action === 'add' ? 'เพิ่ม 1 แต้มใช่หรือไม่?' : 'ยืนยันการใช้สิทธิ์แลกแก้วฟรี?';
        if (!confirm(confirmMsg)) return;

        const btnId = action === 'add' ? 'btn-add' : 'btn-redeem';
        const originalText = document.getElementById(btnId).innerText;
        document.getElementById(btnId).innerText = 'กำลังบันทึก...';

        fetch(`${scriptURL}?phone=${phone}&action=${action}`)
            .then(res => res.text())
            .then(pts => {
                document.getElementById(btnId).innerText = originalText;
                updateDisplay(parseInt(pts));
            });
    }

    // 4. ฟังก์ชันอัปเดตการแสดงผลแต้ม (เปลี่ยนสี/ไอคอน)
    function updateDisplay(points) {
        document.getElementById('display-points').innerText = `${points}/10`;
        
        for (let i = 1; i <= 10; i++) {
            const stamp = document.getElementById(`stamp-${i}`);
            if (i <= points) {
                stamp.classList.add('active-stamp');
                stamp.innerHTML = '🥥'; // ใส่ลูกมะพร้าวเมื่อได้แต้ม
            } else {
                stamp.classList.remove('active-stamp');
                stamp.innerHTML = i;
            }
        }

        // เช็คเงื่อนไขครบ 10 แต้ม
        if (points >= 10) {
            document.getElementById('btn-redeem').classList.remove('hidden');
            document.getElementById('btn-add').classList.add('hidden');
        } else {
            document.getElementById('btn-redeem').classList.add('hidden');
            document.getElementById('btn-add').classList.remove('hidden');
        }
    }
</script>
</body>
</html>
